YAML
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: shalini2023a/web-app:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: web-service

spec:
  type: NodePort
  selector:
    app: web-app

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007